# Releases of the Kelll31/teamclaude_desktop fork: unofficial, unsigned builds that
# update themselves from that fork's GitHub Releases. Everything else comes
# from electron-builder.yml. The publish block only tells electron-builder
# where the feed is, so it writes resources/app-update.yml into the package and
# latest.yml / latest-linux.yml beside it; uploading is done by
# .github/workflows/desktop-release.yml with `gh release`, never from here
# (`--publish never`).
extends: ./electron-builder.yml
publish:
  provider: github
  owner: Kelll31
  repo: teamclaude_desktop
  releaseType: release
  # The fork also carries upstream's v1.x npm tags; desktop releases have their own.
  tagNamePrefix: desktop-v
